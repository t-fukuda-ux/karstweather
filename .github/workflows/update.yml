name: Update weather forecast

on:
  schedule:
    # 毎時11分・41分。毎時0分はGitHub全体で最混雑のため回避（公式も遅延・ドロップを明記）。
    # scheduledトリガーは理由不明で発火しないことがあるため（2026-07-01/02に発生）、
    # 毎時2回スケジュールして片方がドロップされても更新が続く保険とする。
    # サーバーPCの軽量トリガー(local-trigger/、毎時20分)が workflow_dispatch で二重化している。
    - cron: '11,41 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 遅延したschedule実行が重なった場合の多重起動を防ぐ（後発は先発の完了を待つ）
concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 3版すべて生成（規定/EC/平均、1版失敗でも他は継続）
        shell: pwsh
        id: generate
        continue-on-error: true
        run: ./generate_all.ps1

      - name: 変更があればコミット・push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lowcloud.html lowcloud_ec.html lowcloud_avg.html index.html unkai_lab.html forecast-history
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
            exit 0
          fi
          git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # ローカルタスクのpushと競合した場合に備え、rebaseして最大3回再試行する。
          # rebase中の -X theirs は「再適用する自分のコミット側」＝今生成した最新HTMLを優先する。
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            echo "push失敗（${i}回目）。10秒後に再試行します。"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "pushに3回失敗しました。"
          exit 1

      # 外部の死活監視（Healthchecks.io）へ「公開できた」合図を送る。合図が途絶えると監視側からメールが届くので、
      # PC停止・cron停止・生成失敗のどれでも気づける。Secrets の HC_PING_URL が未設定なら何もしない。
      - name: 死活監視へ成功を通知
        if: steps.generate.outcome == 'success' && steps.push.outcome == 'success'
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "HC_PING_URL 未設定のため省略します。"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL" || echo "死活監視への通知に失敗（公開には影響なし）"

      # 成功した版をpushした後で判定するため、警告が他版の公開を妨げない。
      - name: 平均版の更新停止を確認（3時間）
        if: always()
        shell: pwsh
        run: ./check_forecast.ps1

      - name: 生成・履歴保存の失敗を通知
        if: always() && steps.generate.outcome == 'failure'
        shell: bash
        run: exit 1
